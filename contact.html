<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>洋菓子店 Grace Sweets - コンタクト</title>
  <meta name="description" content="レストラン">
  <meta name="viewport" content="width=device-width, inital-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <div class="wrapper">
      <div>
        <a class="home" href="index.html">
          <p class="sup">洋菓子店</p>
          <p class="title">Grace Sweets</p>
        </a>
      </div>
      <div>
        <nav>
          <ul class="nav-items">
            <li><a class="nav-item" href="info.html">店舗情報</a></li>
            <li><a class="nav-item" href="menu.html">メニュー</a></li>
            <li><a class="nav-item current" href="contact.html">コンタクト</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main id="contact">
    <div class="wrapper">
      <h1>コンタクト</h1>
      <div class="description">ご質問やご要望がございましたら、お気軽にご連絡ください。</div>
      <form action="">
        <div class="form-example">
          <label for="name">お名前</label>
          <input type="text" name="name" id="name" required />
        </div>
        <div class="form-example">
          <label for="email">メールアドレス</label>
          <input type="email" name="email" id="email" required />
        </div>
        <div class="form-example">
          <label for="message">メッセージ</label>
          <textarea name="message" id="message" rows="5" required></textarea>
        </div>
        <div class="form-example">
          <input type="submit" value="送信" />
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="wrapper">
      <p><small>&copy; 2025 Grace Sweets</small></p>
    </div>
  </footer>
</body>

</html>
